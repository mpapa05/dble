<dialog #editorDialog class="editor-dialog-native non-printable" (click)="closeOnOverlayClick($event)">
  <div class="editor-modal" (click)="$event.stopPropagation()">
    
    <div class="modal-header">
      <h3>Kártya kézi szerkesztője (Húzd az egérrel!)</h3>
      <button class="close-btn" (click)="closePopup()">✕</button>
    </div>

    <div class="modal-body">
      <!-- BAL OLDAL: A kártya és az egérrel húzható emojik -->
      <div class="preview-container">
        <!-- Átadtuk a #cardBoundary referenciát a pontos méret számításhoz -->
        <div class="dobble-card large-card" #cardBoundary>
          <div class="card-area">
            <div
              *ngFor="let item of placedItems; let i = index"
              [style.top]="item.top"
              [style.left]="item.left"
              [style.transform]="item.transform"
              class="dobble-item editable-item"
              [class.selected-item]="selectedItemIndex === i"
              (click)="selectItem(i)"
              
              /* CDK DRAG AND DROP KIEGÉSZÍTÉS */
              cdkDrag
              [cdkDragBoundary]="cardBoundary"
              (cdkDragEnded)="onDragEnded($event, i)"
            >
              <!-- Egy pici fogantyú vagy egyedi stílus drag közben (opcionális) -->
              <img *ngIf="item.isImage" [src]="item.text" alt="symbol" class="symbol-img" />
              <span *ngIf="!item.isImage">{{ item.text }}</span>
            </div>
          </div>
        </div>
        <p class="hint-text">Fogd meg az egereddel az emojikat a mozgatáshoz!<br>Kattintás után a jobb oldalon forgathatod és méretezheted őket.</p>
      </div>

      <!-- JOBB OLDAL: Csak a Méret és Forgatás maradt meg! -->
      <div class="controls-container">
        <h4 *ngIf="selectedItemIndex === null">Nincs elem kijelölve</h4>
        <h4 *ngIf="selectedItemIndex !== null">
          Kijelölve: {{ placedItems[selectedItemIndex].text }}
        </h4>

        <div *ngIf="selectedItemIndex !== null" class="sliders">
          <!-- MÉRET -->
          <div class="control-group">
            <label>Méret (Nagyítás): <span>{{currentScale}}x</span></label>
            <input type="range" min="0.4" max="2.5" step="0.05" 
                   [(ngModel)]="currentScale" (input)="updateItemTransform()" />
          </div>

          <!-- FORGATÁS -->
          <div class="control-group">
            <label>Forgatás: <span>{{currentRotation}}°</span></label>
            <input type="range" min="0" max="360" step="5" 
                   [(ngModel)]="currentRotation" (input)="updateItemTransform()" />
          </div>
        </div>
      </div>

    </div>
  </div>
</dialog>
